<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mundo Anime — Catálogo</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #181b24;
      --surface-2: #222634;
      --accent: #ff3b6b;
      --accent-2: #6c5ce7;
      --text: #f3f5fa;
      --muted: #9aa3b8;
      --border: rgba(255, 255, 255, 0.08);
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(15, 17, 23, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 0.4px;
      background: linear-gradient(90deg, var(--accent), #ff8fa3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .count-badge {
      font-size: 0.85rem;
      color: var(--muted);
      background: var(--surface-2);
      padding: 4px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    input, select {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.95rem;
      outline: none;
    }

    input {
      flex: 1;
      min-width: 200px;
    }

    input:focus, select:focus {
      border-color: var(--accent);
    }

    main {
      max-width: 1200px;
      margin: 24px auto;
      padding: 0 20px 40px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 18px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .card img {
      width: 100%;
      height: 290px;
      object-fit: cover;
      background: var(--surface-2);
      display: block;
    }

    .card-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .tag {
      background: rgba(108, 92, 231, 0.2);
      color: #b8afff;
      padding: 2px 9px;
      border-radius: 999px;
      font-weight: 600;
    }

    .synopsis {
      font-size: 0.85rem;
      color: var(--muted);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .status-box {
      text-align: center;
      padding: 40px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--muted);
    }

    .status-box h2 {
      color: var(--text);
      margin-bottom: 8px;
      font-size: 1.15rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand-row">
        <div class="brand">MUNDO ANIME</div>
        <div class="count-badge" id="countBadge">Cargando...</div>
      </div>
      <div class="controls">
        <input type="search" id="searchInput" placeholder="Buscar anime por título..." />
        <select id="genreSelect">
          <option value="">Todos los géneros</option>
        </select>
      </div>
    </div>
  </header>

  <main>
    <div id="statusBox" class="status-box">
      <h2>Iniciando catálogo...</h2>
      <p>Conectando con la base de datos.</p>
    </div>
    <div id="catalogGrid" class="grid" style="display: none;"></div>
  </main>

  <script>
    // Sustituye estos valores con los de tu proyecto en Supabase si aún no están puestos
    const SUPABASE_URL = "https://vskecpeihclqjjgxagvb.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_7WBeV8jMTJqMAUvLTcj3Sw_iETj2eX2EY";s
    const TABLE_NAME = "animes";

    const statusBox = document.getElementById("statusBox");
    const catalogGrid = document.getElementById("catalogGrid");
    const countBadge = document.getElementById("countBadge");
    const searchInput = document.getElementById("searchInput");
    const genreSelect = document.getElementById("genreSelect");

    let allAnimes = [];

    function showStatus(title, message) {
      catalogGrid.style.display = "none";
      statusBox.style.display = "block";
      statusBox.innerHTML = `<h2>${title}</h2><p>${message}</p>`;
    }

    function renderAnimes(list) {
      countBadge.textContent = `${list.length} ${list.length === 1 ? "anime" : "animes"}`;

      if (!list.length) {
        showStatus("Sin resultados", "No se encontraron animes con ese filtro.");
        return;
      }

      statusBox.style.display = "none";
      catalogGrid.style.display = "grid";
      catalogGrid.innerHTML = list.map((anime) => {
        const title = anime.title || anime.titulo || anime.name || "Sin título";
        const genre = anime.genre || anime.genero || "General";
        const year = anime.year || anime.anio || "";
        const synopsis = anime.synopsis || anime.sinopsis || anime.description || "";
        const cover = anime.cover_url || anime.imagen || anime.image_url || "";

        return `
          <article class="card">
            ${cover ? `<img src="${cover}" alt="${title}" loading="lazy" />` : ""}
            <div class="card-body">
              <div class="card-title">${title}</div>
              <div class="meta">
                <span class="tag">${genre}</span>
                <span>${year}</span>
              </div>
              ${synopsis ? `<p class="synopsis">${synopsis}</p>` : ""}
            </div>
          </article>
        `;
      }).join("");
    }

    function populateGenres(list) {
      const genres = [...new Set(
        list
          .map((item) => item.genre || item.genero)
          .filter(Boolean)
      )].sort();

      genreSelect.innerHTML = `<option value="">Todos los géneros</option>` +
        genres.map((g) => `<option value="${g}">${g}</option>`).join("");
    }

    function applyFilters() {
      const query = searchInput.value.trim().toLowerCase();
      const selectedGenre = genreSelect.value;

      const filtered = allAnimes.filter((anime) => {
        const title = String(anime.title || anime.titulo || anime.name || "").toLowerCase();
        const genre = String(anime.genre || anime.genero || "");
        const matchesQuery = !query || title.includes(query);
        const matchesGenre = !selectedGenre || genre === selectedGenre;
        return matchesQuery && matchesGenre;
      });

      renderAnimes(filtered);
    }

    async function initCatalog() {
      if (!window.supabase) {
        showStatus("Error al cargar Supabase", "No se pudo cargar la librería supabase-js desde el CDN.");
        return;
      }

      if (
        !SUPABASE_URL.startsWith("https://") ||
        SUPABASE_URL.includes("TU_SUPABASE_URL") ||
        SUPABASE_ANON_KEY.includes("TU_SUPABASE_ANON_KEY")
      ) {
        showStatus(
          "Faltan credenciales de Supabase",
          "Edita SUPABASE_URL y SUPABASE_ANON_KEY dentro de index.html con los datos reales de tu proyecto en Supabase."
        );
        return;
      }

      try {
        const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const { data, error } = await client.from(TABLE_NAME).select("*");

        if (error) {
          showStatus("Error en Supabase", error.message);
          return;
        }

        allAnimes = data || [];
        populateGenres(allAnimes);
        renderAnimes(allAnimes);
      } catch (err) {
        showStatus("Error inesperado", err.message || "Revisa la configuración de Supabase.");
      }
    }

    searchInput.addEventListener("input", applyFilters);
    genreSelect.addEventListener("change", applyFilters);

    initCatalog();
  </script>
</body>q
</html>
