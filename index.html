<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mundo Anime</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0b10;--panel:#14161f;--line:#252839;--text:#eef0f7;--muted:#9a9fb5;--acc:#ff4d5e}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:Outfit,system-ui,sans-serif;line-height:1.5;padding-bottom:env(safe-area-inset-bottom,0px)}
nav{position:sticky;top:0;z-index:5;display:flex;gap:12px;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:rgba(10,11,16,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.logo{font-family:"Bebas Neue",Impact,sans-serif;font-size:1.9rem;letter-spacing:1px;line-height:1}
.logo span{color:var(--acc)}
input{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 16px;min-width:0;width:min(220px,48vw)}
input:focus-visible,.chip:focus-visible,.card:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.hero{position:relative;overflow:hidden;min-height:340px;display:flex;align-items:flex-end}
.hero .bg{position:absolute;inset:-30px;background:#1b1e2e center/cover;filter:blur(26px) brightness(.5) saturate(1.2)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 4%,transparent 75%)}
.hero-in{position:relative;z-index:1;display:flex;gap:20px;align-items:flex-end;padding:32px 16px 26px;max-width:1100px;margin:0 auto;width:100%}
.hero img{width:130px;aspect-ratio:2/3;object-fit:cover;border-radius:8px;box-shadow:0 14px 40px rgba(0,0,0,.65);flex:none}
.hero h1{font-family:"Bebas Neue",Impact,sans-serif;font-weight:400;font-size:clamp(2.4rem,9vw,4.6rem);line-height:.95;margin:6px 0}
.badge{display:inline-block;background:var(--acc);color:#fff;font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;border-radius:4px;padding:2px 8px}
.m{color:var(--muted);font-size:.88rem;margin:0}
.syn{margin:8px 0 14px;max-width:52ch;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.btn{font:inherit;font-weight:600;cursor:pointer;color:#fff;background:var(--acc);border:0;border-radius:6px;padding:9px 20px}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0 16px}
.chip{font:inherit;white-space:nowrap;cursor:pointer;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 16px}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:600}
h2{font-family:"Bebas Neue",Impact,sans-serif;font-weight:400;font-size:1.8rem;margin:22px 0 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px;padding-bottom:40px}
.card{background:none;border:0;padding:0;text-align:left;color:inherit;cursor:pointer;font:inherit}
.poster{position:relative;aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:var(--panel);border:1px solid var(--line);transition:transform .18s,box-shadow .18s}
.card:hover .poster,.card:focus-visible .poster{transform:translateY(-6px);box-shadow:0 14px 30px rgba(0,0,0,.6)}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.ph{display:grid;place-items:center;height:100%;font-family:"Bebas Neue",Impact,sans-serif;font-size:4rem;color:var(--muted);background:linear-gradient(160deg,#1d2030,#0f1119)}
.card h3{font-size:.95rem;margin:8px 0 0;line-height:1.25}
.empty{grid-column:1/-1;padding:28px;border:1px dashed var(--line);border-radius:8px;text-align:center;color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);width:calc(100% - 32px);max-width:560px;padding:0}
dialog::backdrop{background:rgba(0,0,0,.72)}
.dl{display:flex;gap:16px;padding:20px}
.dl img{width:120px;aspect-ratio:2/3;object-fit:cover;border-radius:8px;flex:none;align-self:flex-start}
.dl h3{font-family:"Bebas Neue",Impact,sans-serif;font-weight:400;font-size:2rem;line-height:1;margin:0 0 6px}
.dl p{margin:8px 0 0}
.x{display:block;margin:0 20px 20px auto}
footer{text-align:center;color:var(--muted);font-size:.82rem;padding:10px 16px 30px}
@media (max-width:520px){.hero img{width:96px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.poster{transition:none}}
</style>
</head>
<body>
<nav>
  <div class="logo">MUNDO <span>ANIME</span></div>
  <input id="q" type="search" placeholder="Buscar anime" aria-label="Buscar anime">
</nav>

<header class="hero" id="hero"></header>

<main class="wrap">
  <h2>Catálogo</h2>
  <div class="chips" id="chips" role="group" aria-label="Filtrar por género"></div>
  <div class="grid" id="grid"></div>
</main>
<footer>Datos de Supabase · pósters de Jikan (MyAnimeList)</footer>

<dialog id="dlg">
  <div class="dl" id="dl"></div>
  <form method="dialog"><button class="btn x">Cerrar</button></form>
</dialog>

<script>
const SB_URL="https://vskecpeihclqjjgxagvb.supabase.co";
const SB_KEY="sb_publishable_7WBeV8jMTJqMAUvLTcj35w_iETj2eX2";
let ANIMES=[
{n:"Naruto",g:"Acción",s:"Un joven ninja marginado sueña con ser el líder de su aldea y gana amigos y rivales en el camino.",a:2002,e:220,m:20},
{n:"One Piece",g:"Aventura",s:"Luffy y su tripulación pirata recorren el mar en busca del tesoro más grande del mundo.",a:1999,e:1100,m:21},
{n:"Attack on Titan",g:"Acción",s:"La humanidad vive tras enormes muros para protegerse de gigantes devoradores de personas.",a:2013,e:94,m:16498},
{n:"Death Note",g:"Misterio",s:"Un estudiante encuentra un cuaderno que mata a quien se escriba en él y un detective genial lo persigue.",a:2006,e:37,m:1535},
{n:"Fullmetal Alchemist: Brotherhood",g:"Fantasía",s:"Dos hermanos alquimistas buscan la piedra filosofal para recuperar lo que perdieron en un ritual prohibido.",a:2009,e:64,m:5114},
{n:"Demon Slayer",g:"Acción",s:"Tanjiro se une a los cazadores de demonios para curar a su hermana convertida en demonio.",a:2019,e:26,m:38000},
{n:"Spy x Family",g:"Comedia",s:"Un espía, una asesina y una niña telépata fingen ser una familia normal para cumplir una misión.",a:2022,e:25,m:50265},
{n:"Your Name",g:"Romance",s:"Dos adolescentes que no se conocen intercambian cuerpos y empiezan a buscarse a través del tiempo.",a:2016,e:1,m:32281}
];
const POSTERS={};
const $=id=>document.getElementById(id);
const grid=$("grid"),chips=$("chips"),q=$("q"),hero=$("hero"),dlg=$("dlg");
let genre="Todos",genres=["Todos"],featured=null;

function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function eps(a){return a.e===1?"Película":a.e+" episodios"}
function drawChips(){
  chips.innerHTML=genres.map(g=>'<button class="chip" aria-pressed="'+(g===genre)+'" data-g="'+esc(g)+'">'+esc(g)+'</button>').join("");
}
function drawHero(){
  const a=featured,p=a&&POSTERS[a.n];
  if(!p){hero.innerHTML='<div class="bg"></div><div class="hero-in"><div><span class="badge">Catálogo</span><h1>Mundo Anime</h1><p class="m">Los animes que no te puedes perder, todos en un solo lugar.</p></div></div>';return}
  hero.innerHTML='<div class="bg" style="background-image:url('+esc(p)+')"></div><div class="hero-in"><img src="'+esc(p)+'" alt="Póster de '+esc(a.n)+'"><div><span class="badge">Destacado</span><h1>'+esc(a.n)+'</h1><p class="m">'+esc(a.g)+' · '+(a.a||"")+' · '+eps(a)+'</p><p class="syn">'+esc(a.s)+'</p><button class="btn" data-i="'+ANIMES.indexOf(a)+'">Ver detalles</button></div></div>';
}
function draw(){
  const t=q.value.trim().toLowerCase();
  const list=ANIMES.map((a,i)=>({...a,i})).filter(a=>(genre==="Todos"||a.g===genre)&&a.n.toLowerCase().includes(t));
  grid.innerHTML=list.length?list.map(a=>{
    const p=POSTERS[a.n];
    return '<button class="card" data-i="'+a.i+'"><div class="poster">'+(p?'<img src="'+esc(p)+'" alt="Póster de '+esc(a.n)+'" loading="lazy">':'<div class="ph">'+esc(a.n[0])+'</div>')+'</div><h3>'+esc(a.n)+'</h3><span class="m">'+esc(a.g)+' · '+(a.a||"")+'</span></button>';
  }).join(""):'<div class="empty">No encontramos animes con ese nombre. Prueba con otra búsqueda o cambia el género.</div>';
}
function openInfo(i){
  const a=ANIMES[i],p=POSTERS[a.n];
  $("dl").innerHTML=(p?'<img src="'+esc(p)+'" alt="Póster de '+esc(a.n)+'">':'')+'<div><h3>'+esc(a.n)+'</h3><p class="m">'+esc(a.g)+' · '+(a.a||"")+' · '+eps(a)+'</p><p>'+esc(a.s)+'</p></div>';
  dlg.showModal();
}

async function loadAnimes(){
  try{
    const r=await fetch(SB_URL+"/rest/v1/animes?select=nombre,genero,sinopsis,anio,episodios,mal_id,imagen&order=anio.asc",{headers:{apikey:SB_KEY}});
    if(!r.ok)throw new Error(r.status);
    const rows=await r.json();
    if(rows.length)ANIMES=rows.map(x=>({n:x.nombre,g:x.genero||"Otros",s:x.sinopsis||"",a:x.anio,e:x.episodios||1,m:x.mal_id,img:x.imagen}));
  }catch(err){console.warn("Usando copia local",err)}
  genres=["Todos",...new Set(ANIMES.map(a=>a.g))];
  drawChips();draw();loadPosters();
}

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function loadPosters(){
  let cache={};
  try{cache=JSON.parse(localStorage.getItem("posters2")||"{}")}catch(e){}
  for(const a of ANIMES){
    let u=a.img||cache[a.n];
    if(!u){
      try{
        const url=a.m?"https://api.jikan.moe/v4/anime/"+a.m:"https://api.jikan.moe/v4/anime?limit=1&sfw=true&q="+encodeURIComponent(a.n);
        const r=await fetch(url);
        if(r.ok){
          const j=await r.json(),d=Array.isArray(j.data)?j.data[0]:j.data;
          u=d&&d.images&&d.images.jpg&&d.images.jpg.large_image_url;
          if(u){cache[a.n]=u;try{localStorage.setItem("posters2",JSON.stringify(cache))}catch(e){}}
        }
      }catch(err){}
      await sleep(450);
    }
    if(u){POSTERS[a.n]=u;if(!featured){featured=a;drawHero()}draw()}
  }
}

chips.addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;genre=b.dataset.g;drawChips();draw()});
document.addEventListener("click",e=>{const c=e.target.closest("[data-i]");if(c)openInfo(+c.dataset.i)});
dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close()});
q.addEventListener("input",draw);
drawHero();drawChips();draw();loadAnimes();
</script>
</body>
</html>a
